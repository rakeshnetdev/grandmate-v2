# fly.toml — GrandMate v2 backend
#
# `fly launch` rewrites this file and strips every comment. If you run it again, decline
# the "overwrite fly.toml?" prompt, or restore this from git afterwards: the values below
# are decisions, and several of them fail silently rather than loudly when wrong.
#
# See https://fly.io/docs/reference/configuration/

app = 'grandmate-v2-backend'
# Matched to the database, not to users. One chat turn costs many round trips to Postgres
# — session lookup, game queries, pgvector search, two LangGraph checkpointer writes —
# while a user pays one round trip to this app, so app-to-database latency is what
# multiplies. `sea` is Fly's closest region to the Neon project's AWS `us-west-2` (Oregon).
# `fly launch` defaulted this to `sjc`, which picks the region nearest the developer
# rather than nearest the database. Moving either one means moving both.
primary_region = 'sea'

[build]
  dockerfile = 'Dockerfile'

# Runs on every deploy, before the new machines take traffic. Alembic is in the image
# (`COPY alembic ./alembic`), so this needs no separate release image.
#
# Note that this command does *not* go through `missing_required_for_production()` — it
# calls Alembic directly. An unset DATABASE_URL therefore does not fail here as "missing
# configuration"; it falls back to the local development default and fails as
# "connection to 127.0.0.1:5433 refused", which is the same bug wearing a disguise.
[deploy]
  release_command = 'uv run alembic upgrade head'

[env]
  API_HOST = '0.0.0.0'
  API_PORT = '7575'
  HOST = '0.0.0.0'
  PORT = '7575'
  STORAGE_LOCAL_PATH = '/app/.storage'
  # Turns on Secure cookies, hard-disables every /dev/* route, and makes startup fail on
  # missing configuration rather than deferring to the first request that needs it.
  APP_ENV = 'production'
  # Debian's `stockfish` package installs to /usr/games/stockfish and does not put it on
  # PATH. The settings default is /usr/local/bin/stockfish, which does not exist in this
  # image — without this override every analysis job fails to start an engine while the
  # container stays perfectly healthy. Verified by running the Dockerfile's own apt-get
  # line in python:3.13-slim. See runbooks/incidents.md, incident 6.
  STOCKFISH_PATH = '/usr/games/stockfish'
  # 2 x ENGINE_HASH_MB=128 of hash tables plus ~350 MB of Python, FastAPI and the opening
  # index. The machine is now 2 GB (see [[vm]]), so 4 would also fit — left at 2 because
  # nothing has yet measured real memory use under concurrent analysis on this host.
  ENGINE_MAX_CONCURRENT_GAMES = '2'
  # Must name the deployed frontend origin exactly: allow_credentials is True, and a
  # browser rejects a wildcard in that combination. Under SESSION_COOKIE_SAMESITE=none
  # this allow-list is the *only* thing bounding who may make a credentialed request
  # carrying a user's session, so `/ready` reports it as missing config if left as '*'.
  # The REPLACE-ME placeholder is deliberate: it fails readiness rather than silently
  # allowing the wrong origin.
  CORS_ALLOWED_ORIGINS = 'https://REPLACE-ME.vercel.app'
  # Vercel and Fly are cross-site — both registrable domains sit on the Public Suffix
  # List — so `lax` would have the browser accept the session cookie at login and then
  # never send it, and only the *next* request would 401. See DEPLOYMENT.md §4.
  SESSION_COOKIE_SAMESITE = 'none'

# Secrets are NOT here — this file is committed. Set with `fly secrets set`:
#   DATABASE_URL, OPENAI_API_KEY, SESSION_JWT_SECRET

[[mounts]]
  source = 'grandmate_storage'
  destination = '/app/.storage'

[http_service]
  internal_port = 7575
  force_https = true
  # Engine analysis and platform imports run in FastAPI `BackgroundTasks`, which start
  # *after* the response is sent. A machine that auto-stops when the request queue drains
  # therefore dies mid-Stockfish, leaving the job `pending` with nothing to pick it up —
  # the import looks like it succeeded and the analysis silently never arrives.
  #
  # Keeping one machine always running is the demo-grade fix, and it is a workaround, not
  # a design: it costs an always-on machine and still loses in-flight work on a deploy or
  # a crash. The real fix is a worker process consuming the `jobs` table, which the schema
  # was already designed for. See DEPLOYMENT.md §6.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m30s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  cpus = 1
  # DEPLOYMENT.md §3 calls 1 GB the minimum and 2 GB comfortable; `fly launch` chose 2 GB
  # and that is the right end of the range for Stockfish hash tables.
  memory = '2gb'

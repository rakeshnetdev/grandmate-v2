# Pre-commit hooks.
#
# Install once with:  uv tool install pre-commit && pre-commit install
#
# The secret-detection hooks are the important ones. Everything else here is also checked
# in CI, so a bypassed hook is caught later — but a committed key is in git history
# permanently, and rotating it is the only real remedy. That asymmetry is why secret
# checks run locally rather than only in CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      # Catches AWS-style keys and other common credential patterns.
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Broad secret scanning. Complements detect-private-key, which only covers keys.
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: block-env-files
        name: block .env files from being committed
        # .gitignore already covers this, but a `git add -f` would slip past it.
        entry: 'Refusing to commit a .env file. Secrets belong in .env, which stays local.'
        language: fail
        files: '(^|/)\.env($|\..*)'
        exclude: '\.env\.example$'

      - id: frontend-lint
        name: oxlint (frontend)
        entry: bash -c 'cd frontend && npx oxlint'
        language: system
        pass_filenames: false
        files: ^frontend/src/

      - id: frontend-format
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --check .'
        language: system
        pass_filenames: false
        files: ^frontend/
